[workspace]
members = [
    "crates/metal2vulkan",
    "crates/metal2vulkan-air",
    "crates/metal2vulkan-devtools",
    "crates/metal2vulkan-runtime",
    "crates/metal2vulkan-validation",
]
# A bare `cargo build`, `cargo test` or `cargo run` at the root acts on the translator alone, as it
# did when the translator's package was this manifest; `--workspace` or `-p` selects the others.
default-members = ["crates/metal2vulkan"]
resolver = "2"

# What every crate here shares. The translator's source fingerprint hashes this manifest beside its
# own, because the translator inherits from it (`build_support.rs`).
[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
authors = ["Anees Iqbal <hello@aneesiqbal.ai>"]
repository = "https://github.com/steelbrain/metal2vulkan"
homepage = "https://github.com/steelbrain/metal2vulkan"

# The external dependencies more than one crate takes, at one version each. A crate adds its own
# features (and `optional`). The crates' dependencies on one another stay in their own manifests,
# by path and version: the translator pins the AIR front end exactly (`=0.x.y`), and its build
# script reads that path from its own manifest.
[workspace.dependencies]
# Never the loader at build time: a crate that opens it adds `loaded`.
ash = { version = "0.38", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Cargo's default release profile turns incremental compilation OFF, which means every rebuild of
# the translator is a full rebuild of all ~262k lines of it. That is the whole cost: measured on an
# idle machine, a one-line source edit cost 24.97s to rebuild without incremental and 1.67s with it.
#
# It buys that back for nothing measurable. A cold build is unchanged (23.4s incremental vs 24.0s
# not), and translation throughput is unchanged: 300 corpus modules translated four times each took
# 46.2s incremental against 46.6s not, run to run repeatable to within 0.5s. The 20-second/500 MiB
# per-translation contract in AGENTS.md is unaffected.
#
# Profile settings only apply to builds whose workspace root this is, so this changes how the repo
# builds itself and nothing about how a consumer builds the published crates.
[profile.release]
incremental = true

# Dev and test builds keep line tables (file and line in backtraces) and no other debug info, and
# dependencies none. Full debug info made each link of a binary holding the translator, the runtime
# and validation take 35-47 s; on an i9-13900 the clean workspace build's links
# summed to 726 s against 94 s with this, and its target to half the size. A debugger session that
# needs variables builds with CARGO_PROFILE_DEV_DEBUG=full. Like the release profile above, this
# changes only how the repo builds itself.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
