# The Vulkan loader serves these calls itself and reads the device handle's first word, which
# MoltenVK 1.4.1 overwrites when it reports a message about the device. Validation
# makes them only through `VulkanContext` (`candidate/platform/device.rs`), which puts the word
# back first. Command tables load through `vkGetDeviceProcAddr`: `ash::Device::load`, the
# extension tables validation uses, and the debug-utils and debug-marker tables are listed, with
# the object naming and tagging calls of those two that ash has (the loader serves them too).
# Another `ash::<ext>::Device::new` that validation starts to use must be added here.
disallowed-methods = [
  { path = "ash::Device::allocate_command_buffers", reason = "use VulkanContext::allocate_command_buffers" },
  { path = "ash::Device::destroy_device", reason = "VulkanContext's Drop destroys the device" },
  { path = "ash::Device::get_device_queue", reason = "the context's queue is VulkanContext::queue" },
  { path = "ash::Device::get_device_queue2", reason = "the context's queue is VulkanContext::queue" },
  { path = "ash::Instance::get_device_proc_addr", reason = "load device commands through VulkanContext" },
  { path = "ash::Device::load", reason = "load device commands through VulkanContext" },
  { path = "ash::ext::debug_utils::Device::new", reason = "load device commands through VulkanContext" },
  { path = "ash::ext::debug_utils::Device::set_debug_utils_object_name", reason = "the loader serves it and reads the device's word" },
  { path = "ash::ext::debug_utils::Device::set_debug_utils_object_tag", reason = "the loader serves it and reads the device's word" },
  { path = "ash::ext::debug_marker::Device::new", reason = "load device commands through VulkanContext" },
  { path = "ash::ext::debug_marker::Device::debug_marker_set_object_name", reason = "the loader serves it and reads the device's word" },
  { path = "ash::khr::acceleration_structure::Device::new", reason = "use VulkanContext::acceleration_structure" },
  { path = "ash::khr::swapchain::Device::new", reason = "load it as the device comes back from vkCreateDevice" },
  { path = "ash::ext::extended_dynamic_state::Device::new", reason = "the context loads it at creation" },
  { path = "ash::ext::extended_dynamic_state2::Device::new", reason = "the context loads it at creation" },
]
